<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CEUCAtlas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://ceuca.uca.es/wp-content/uploads/2025/12/ceucatlas.webp" type="image/webp">
  <link rel="apple-touch-icon" href="https://ceuca.uca.es/wp-content/uploads/2025/12/ceucatlas.webp">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script id="pwa-manifest" type="application/json">
    {
      "name": "CEUCAtlas",
      "short_name": "CEUCAtlas",
      "description": "Mapa interactivo de la Universidad de Cádiz",
      "start_url": "/",
      "display": "standalone",
      "background_color": "#1f2937",
      "theme_color": "#1f2937",
      "icons": [
        {
          "src": "https://ceuca.uca.es/wp-content/uploads/2025/12/ceucatlas.webp",
          "sizes": "192x192",
          "type": "image/webp"
        },
        {
          "src": "https://ceuca.uca.es/wp-content/uploads/2025/12/ceucatlas.webp",
          "sizes": "512x512",
          "type": "image/webp"
        }
      ]
    }
  </script>

  <style>
    :root {
      --color-fondo-primario: #1f2937;
      --color-texto-primario: #1f2937;
      --color-texto-secundario: #9ca3af;
      --color-fondo-secundario: #f3f4f6;
      --color-borde-elementos: rgba(255, 255, 255, 0.3);
      --color-fondo-elementos: rgba(255, 255, 255, 0.1);
      --color-fondo-elementos-hover: rgba(255, 255, 255, 0.25);
      --color-sombra: rgba(0, 0, 0, 0.2);
      --radio-borde: 10px;
      --radio-borde-iconos: 12px;
      --tamano-iconos: 30px;
      --duracion-transicion: 0.2s;
      --z-index-dock: 7000;
      --z-index-sidebar: 6000;
      --z-index-cookie: 3000;
      --z-index-mapa: 1;
      --z-index-fullscreen: 5000;
    }

    body {
      margin: 0;
      font-family: system-ui, Arial;
      background-color: var(--color-fondo-primario);
      color: var(--color-texto-primario);
      overflow: hidden;
    }

    #layout {
      display: flex;
      height: 100dvh;
      width: 100%;
      position: relative;
    }

    /* Estilo para elementos flotantes con blur */
    .elemento-flotante {
      background: rgba(255, 255, 255, 0);
      backdrop-filter: blur(8px);
      border: 1px solid var(--color-borde-elementos);
      box-shadow: 0 2px 4px var(--color-sombra);
      border-radius: var(--radio-borde);
      overflow: hidden;
      z-index: var(--z-index-dock);
    }

    /* Title Bar */
    .title-bar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px;
      width: fit-content;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 16px;
      z-index: var(--z-index-dock);
    }

    /* Dock */
    .dock {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      padding: 10px;
      width: fit-content;
      z-index: var(--z-index-dock);
    }

    /* Iconos del Dock */
    .dock-icon {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radio-borde-iconos);
      background: var(--color-fondo-elementos);
      transition: all var(--duracion-transicion) ease;
      cursor: pointer;
      user-select: none;
      color: var(--color-texto-primario);
      font-size: var(--tamano-iconos);
    }

    .dock-icon:hover {
      transform: scale(1.1);
      background: var(--color-fondo-elementos-hover);
      box-shadow: 0 4px 8px var(--color-sombra);
    }

    /* Sidebar */
    #sidebar {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 320px;
      height: calc(100dvh - 20px);
      background: rgba(31, 41, 55, 0.9);
      backdrop-filter: blur(8px);
      border-radius: var(--radio-borde);
      border: 1px solid var(--color-borde-elementos);
      box-shadow: 2px 2px 8px var(--color-sombra);
      color: white;
      display: flex;
      flex-direction: column;
      z-index: var(--z-index-sidebar);
      overflow: hidden;
      transform: translateX(-100%);
      transition: transform 0.3s ease-in-out;
    }

    #sidebar.visible {
      transform: translateX(0);
    }

    #sidebar.hidden {
      pointer-events: none;
      transform: translateX(-100%);
    }

    .sidebar-header {
      padding: 10px;
      flex-shrink: 0;
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px;
    }

    .sidebar-footer {
      padding: 10px;
      flex-shrink: 0;
    }

    .sidebar-logo-ceucatlas {
      display: block;
      margin: 0 auto;
      width: 90%;
      max-width: 300px;
    }

    /* Mapa */
    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-index-mapa);
    }

    /* Pantallas completas */
    .fullscreen-content {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(31, 41, 55, 0.95);
      backdrop-filter: blur(8px);
      z-index: var(--z-index-fullscreen);
      display: none;
      padding-top: 60px;
      padding-bottom: 80px;
      overflow-y: auto;
      color: white;
    }

    .fullscreen-content.visible {
      display: block;
    }

    /* Móvil */
    @media (max-width: 768px) {
      #sidebar {
        left: 10px;
        right: 10px;
        width: calc(100% - 20px);
      }
    }

    /* Cookies */
    .cookie-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: var(--z-index-cookie);
      justify-content: center;
      align-items: center;
    }

    .cookie-modal-content {
      background: var(--color-fondo-primario);
      padding: 25px;
      border-radius: var(--radio-borde);
      max-width: 500px;
      width: 90%;
      color: var(--color-texto-primario);
      box-shadow: 0 4px 6px var(--color-sombra);
    }

    .cookie-modal-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .cookie-button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .cookie-reject {
      background: #6b7280;
      color: white;
    }

    .cookie-accept {
      background: #3b82f6;
      color: white;
    }
  </style>
</head>

<body>
  <!-- COOKIES -->
  <div id="cookie-consent-modal" class="cookie-modal">
    <div class="cookie-modal-content">
      <h3>Aviso de Cookies</h3>
      <p>Este sitio web utiliza cookies propias y de terceros para mejorar tu experiencia de navegación.</p>
      <div class="cookie-modal-buttons">
        <button id="reject-cookies" class="cookie-button cookie-reject">Rechazar</button>
        <button id="accept-cookies" class="cookie-button cookie-accept">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- PÁGINA -->
  <main id="layout">
    <nav class="dock elemento-flotante">
      <div class="dock-icon" id="toggle-sidebar">
        <i class="fas fa-list"></i>
      </div>
      <div class="dock-icon" id="map-icon">
        <i class="fas fa-map-location-dot"></i>
      </div>
      <div class="dock-icon" id="home-icon">
        <i class="fas fa-house"></i>
      </div>
      <div class="dock-icon" id="notifications-icon">
        <i class="fas fa-bell"></i>
      </div>
      <div class="dock-icon" id="settings-icon">
        <i class="fas fa-gear"></i>
      </div>
    </nav>

    <div class="title-bar elemento-flotante">CEUCAtlas</div>

    <aside id="sidebar">
      <header class="sidebar-header">
        <img class="sidebar-logo-ceucatlas" src="https://ceuca.uca.es/wp-content/uploads/2025/12/ceucatlas.webp" alt="CEUCAtlas">
      </header>
      <div id="sidebarContent" class="sidebar-body">
        <!-- Contenido dinámico -->
      </div>
    </aside>

    <!-- Pantallas completas -->
    <div id="home-screen" class="fullscreen-content">
      <!-- Contenido de la pantalla de Inicio -->
      <h2 style="text-align: center;">Pantalla de Inicio</h2>
      <!-- Personaliza este contenido -->
    </div>

    <div id="notifications-screen" class="fullscreen-content">
      <!-- Contenido de la pantalla de Notificaciones -->
      <h2 style="text-align: center;">Pantalla de Notificaciones</h2>
      <!-- Personaliza este contenido -->
    </div>

    <div id="settings-screen" class="fullscreen-content">
      <!-- Contenido de la pantalla de Configuración -->
      <h2 style="text-align: center;">Pantalla de Configuración</h2>
      <!-- Personaliza este contenido -->
    </div>

    <div id="map"></div>
  </main>

  <!-- Registro dinámico del manifest.json de la PWA -->
  <script>
    const manifestContent = document.getElementById('pwa-manifest').textContent;
    const manifestBlob = new Blob([manifestContent], { type: 'application/json' });
    const manifestURL = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const sidebar = document.getElementById('sidebar');
      const toggleSidebar = document.getElementById('toggle-sidebar');
      const homeIcon = document.getElementById('home-icon');
      const notificationsIcon = document.getElementById('notifications-icon');
      const settingsIcon = document.getElementById('settings-icon');
      const mapIcon = document.getElementById('map-icon');

      const homeScreen = document.getElementById('home-screen');
      const notificationsScreen = document.getElementById('notifications-screen');
      const settingsScreen = document.getElementById('settings-screen');

      // Función para ocultar todas las pantallas
      function hideAllScreens() {
        homeScreen.classList.remove('visible');
        notificationsScreen.classList.remove('visible');
        settingsScreen.classList.remove('visible');
      }

      // Eventos para los iconos del dock
      homeIcon.addEventListener('click', () => {
        hideAllScreens();
        homeScreen.classList.add('visible');
      });

      notificationsIcon.addEventListener('click', () => {
        hideAllScreens();
        notificationsScreen.classList.add('visible');
      });

      settingsIcon.addEventListener('click', () => {
        hideAllScreens();
        settingsScreen.classList.add('visible');
      });

      mapIcon.addEventListener('click', () => {
        hideAllScreens();
      });

      // Sidebar
      toggleSidebar.addEventListener('click', () => {
        sidebar.classList.toggle('visible');
      });

      // Ocultar sidebar al hacer clic en otro icono del dock
      document.querySelectorAll('.dock-icon:not(#toggle-sidebar)').forEach(icon => {
        icon.addEventListener('click', () => {
          if (sidebar.classList.contains('visible')) {
            sidebar.classList.remove('visible');
          }
        });
      });

      // Ocultar sidebar al hacer clic fuera
      document.addEventListener('click', (e) => {
        if (!sidebar.contains(e.target) && !toggleSidebar.contains(e.target) && sidebar.classList.contains('visible')) {
          sidebar.classList.remove('visible');
        }
      });

      // Cargar Leaflet y el mapa
      loadExternalScripts(initMap);
    });

    function loadExternalScripts(callback) {
      let loadedCount = 0;
      const totalScripts = 2;

      function checkAllLoaded() {
        loadedCount++;
        if (loadedCount === totalScripts) {
          callback();
        }
      }

      // Cargar Leaflet CSS
      const leafletCSS = document.createElement('link');
      leafletCSS.rel = 'stylesheet';
      leafletCSS.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      leafletCSS.onload = checkAllLoaded;
      document.head.appendChild(leafletCSS);

      // Cargar Leaflet JS
      const leafletJS = document.createElement('script');
      leafletJS.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      leafletJS.onload = checkAllLoaded;
      document.head.appendChild(leafletJS);
    }

    function initMap() {
      const map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([36.5298, -6.2035], 16);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 20,
        attribution: 'Map data from <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>. © <a href="https://carto.com/about-carto/">rastertiles/voyager</a>'
      }).addTo(map);

      // Añadir control de zoom personalizado
      L.control.zoom({
        position: 'bottomright'
      }).addTo(map);
    }
  </script>
</body>
</html>
