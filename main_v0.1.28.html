<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CEUCAtlas</title>

<!-- Buena visibilidad multidispositivo -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Favicon -->
<link rel="icon" href="https://ceuca.uca.es/wp-content/uploads/2025/12/ceucatlas.webp" type="image/webp">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet Search -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-search/dist/leaflet-search.min.css">
<script src="https://unpkg.com/leaflet-search/dist/leaflet-search.min.js"></script>

<!-- Font Awesome para el icono de WhatsApp e Instagram -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<!-- Icono para iOS -->
<link rel="apple-touch-icon" href="https://ceuca.uca.es/wp-content/uploads/2025/12/ceucatlas.webp">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- manifest.json de la PWA -->
<script id="pwa-manifest" type="application/json">
{
  "name": "CEUCAtlas",
  "short_name": "CEUCAtlas",
  "description": "Mapa interactivo de la Universidad de Cádiz",
  "start_url": "/",
  "display": "standalone",
  "background_color": "#1f2937",
  "theme_color": "#1f2937",
  "icons": [
    {
      "src": "https://ceuca.uca.es/wp-content/uploads/2025/12/ceucatlas.webp",
      "sizes": "192x192",
      "type": "image/webp"
    },
    {
      "src": "https://ceuca.uca.es/wp-content/uploads/2025/12/ceucatlas.webp",
      "sizes": "512x512",
      "type": "image/webp"
    }
  ]
}
</script>


<style>
body {
  margin:0;
  font-family: system-ui, Arial;
}

#layout {
  display:flex;
  height:100vh;
  width: 100vw;
}

#sidebar {
  position: relative;
  width: 320px;
  min-width: 320px;
  background: #1f2937;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden; /* Evita el scroll del sidebar completo */
}

.sidebar-header {
  padding: 10px;
  flex-shrink: 0; /* Evita que el encabezado se comprima */
}

.sidebar-scrollable {
  flex: 1; /* Ocupa el espacio restante */
  overflow-y: auto; /* Habilita el scroll vertical */
  padding: 0 10px;
}

.sidebar-footer {
  padding: 10px;
  flex-shrink: 0; /* Evita que el pie se comprima */
  position: relative; /* Para posicionar los iconos absolutamente dentro del footer */
}

#sidebar.hidden {
  pointer-events: none;
  width: 0;
  min-width: 0;
  padding: 0;
  overflow: hidden;
}

#sidebar h2 {
  margin:0 0 10px; 
}

#sidebar h3 {
  margin:10px 0 5px;
  border-bottom:1px solid #374151;
}

.sidebar-item {
  padding:4px 10px;
  cursor:pointer;
  font-size:14px;
}
.sidebar-item:hover { 
  background:#374151; 
}

#map-container {
  flex:1; 
  display:flex; 
  flex-direction:column; 
  position: relative; 
}

#filters {
  background: #f3f4f6;
  padding: 8px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  position: relative;
}

.filters-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  width: calc(100% - 40px);
  margin-right: 40px;
}

.filter-pair {
  display: flex;
  align-items: center;
  gap: 5px;
}

.filter-pair label {
  white-space: nowrap;
}

.filter-pair select {
  flex-shrink: 0;
}

#filters-logo {
  height: 32px;
  position: absolute;
  top: 8px;
  right: 8px;
}

#map { flex:1; }

.popup-card h4 {
  margin:0 0 5px;
  color:#2563eb;
}

.popup-card {
  font-size:14px;
}

.version {
  position: absolute;
  bottom: 10px;
  right: 10px;
  color: #9ca3af;
  font-size: 12px;
}

.whatsapp, .instagram {
  position: static;
  margin-bottom: 5px;
  color: #9ca3af;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.whatsapp a, .instagram a {
  color: #9ca3af;
  text-decoration: none;
}

#geolocate {
  position: absolute;
  bottom: 25px;
  right: 10px;
  z-index: 1000;
  background: white;
  width: 36px;
  height: 36px;
  border: 1px solid #d1d5db;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

#geolocate:hover {
  background: #f9fafb;
}

.filter-button {
  background: white;
  width: 36px;
  height: 36px;
  border: 1px solid #d1d5db;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 10px;
}

.filter-button:hover {
  background: #f9fafb;
}

.compass {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 1000;
  background: white;
  width: 36px;
  height: 36px;
  border: 1px solid #d1d5db;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: rotate(0deg);
  transition: transform 0.3s ease;
}

.info-button {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 10;
  background: transparent;
  border: none;
  color: #9ca3af;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  text-decoration: none;
}

.info-button:hover {
  color: white;
}

</style>

<!-- Registro dinámico del manifest.json de la PWA -->
<script>
  // Obtén el contenido del manifest
  const manifestContent = document.getElementById('pwa-manifest').textContent;
  const manifestBlob = new Blob([manifestContent], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);

  // Crea un enlace dinámico para el manifest
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);
</script>


</head>


<body>

<div id="layout">

  <div id="sidebar">
      <div class="sidebar-header">
        <div class="version">v0.1.28</div>
        <a href="https://ceuca.uca.es/ceucatlas" target="_blank" class="info-button" title="Información">
          <i class="fas fa-info-circle"></i>
        </a>
        <img src="https://ceuca.uca.es/wp-content/uploads/2025/12/ceucatlas.webp" alt="" style="display: block; margin-left: auto; margin-right: auto; width: 300px;">
      </div>

      <!-- Contenedor scrolleable -->
      <div id="sidebarContent" class="sidebar-scrollable"></div>

      <!-- Pie del sidebar -->
      <div class="sidebar-footer">
        <div class="whatsapp">
          <i class="fab fa-whatsapp"></i>
          <a href="https://whatsapp.com/channel/0029VbCBfO696H4Qse6SQT0v" target="_blank">Canal del CEUCA</a>
        </div>
        <div class="instagram">
          <i class="fab fa-instagram"></i>
          <a href="https://www.instagram.com/estudiantes.uca" target="_blank">@estudiantes.uca</a>
        </div>
      </div>
    </div>

  <div id="map-container">

    <div id="filters">

      <div class="filters-group">
        <button id="toggle-sidebar" class="filter-button" title="Mostrar/Ocultar barra lateral">
          <i class="fas fa-bars"></i>
        </button>
        <div class="filter-pair">
          <label>Campus:</label>
          <select id="fCampus">
            <option value="todos">Todos</option>
            <option value="Bahía de Algeciras">Bahía de Algeciras</option>
            <option value="Cádiz">Cádiz</option>
            <option value="Jerez">Jerez</option>
            <option value="Puerto Real">Puerto Real</option>
          </select>
        </div>
        <div class="filter-pair">
          <label>Edificio:</label>
          <select id="fEdificio">
            <option value="todos">Todos</option>
            <option value="Escuela de Ingeniería Naval y Oceánica">Escuela de Ingeniería Naval y Oceánica</option>
            <option value="Escuela Técnica Superior de Ingeniería de Algeciras">Escuela Técnica Superior de Ingeniería de Algeciras</option>
            <option value="Escuela Superior de Ingeniería">Escuela Superior de Ingeniería</option>
            <option value="Facultad de Ciencias">Facultad de Ciencias</option>
            <option value="Facultad de Ciencias de la Educación">Facultad de Ciencias de la Educación</option>
            <option value="Facultad de Ciencias del Mar y Ambientales">Facultad de Ciencias del Mar y Ambientales</option>
            <option value="Facultad de Ciencias del Trabajo">Facultad de Ciencias del Trabajo</option>
            <option value="Facultad de Ciencias Económicas y Empresariales">Facultad de Ciencias Económicas y Empresariales</option>
            <option value="Escuela de Ingeniería Marina, Náutica y Radioelectrónica">Escuela de Ingeniería Marina, Náutica y Radioelectrónica</option>
            <option value="Facultad de Ciencias Sociales y de la Comunicación">Facultad de Ciencias Sociales y de la Comunicación</option>
            <option value="Facultad de Derecho">Facultad de Derecho</option>
            <option value="Facultad de Enfermería">Facultad de Enfermería</option>
            <option value="Facultad de Enfermería y Fisioterapia">Facultad de Enfermería y Fisioterapia</option>
            <option value="Facultad de Filosofía y Letras">Facultad de Filosofía y Letras</option>
            <option value="Facultad de Medicina">Facultad de Medicina</option>
            <option value="Escuela de Doctorado de la Universidad de Cádiz">Escuela de Doctorado de la Universidad de Cádiz</option>
            <option value="Escuela Internacional de Doctorado en Estudios del Mar">Escuela Internacional de Doctorado en Estudios del Mar</option>
            <option value="Centro Universitario de Enfermería “Salus Infirmorum”">Centro Universitario de Enfermería “Salus Infirmorum”</option>
            <option value="Centro de Magisterio “Virgen de Europa”">Centro de Magisterio “Virgen de Europa”</option>
          </select>
        </div>
        <div class="filter-pair">
          <label>Planta:</label>
          <select id="fPlanta">
            <option value="todas">Todas</option>
            <option value="sótano">Sótano</option>
            <option value="baja">Baja</option>
            <option value="1">Planta 1</option>
            <option value="2">Planta 2</option>
            <option value="3">Planta 3</option>
            <option value="4">Planta 4</option>
          </select>
        </div>
        <div class="filter-pair">
          <label>Tipo:</label>
          <select id="fTipo">
            <option value="todos">Todos</option>
            <option value="descanso">Área de descanso</option>
            <option value="aula">Aula</option>
            <option value="biblio">Biblioteca o sala de estudio</option>
            <option value="cafete">Cafetería, fuente o máquina</option>
            <option value="despacho">Despacho</option>
            <option value="salon">Salón</option>
            <option value="unidad">Unidades o servicios</option>
          </select>
        </div>
      </div>

      <img id="filters-logo" src="https://ceuca.uca.es/wp-content/uploads/2025/08/logo.webp">
    </div>

    <div class="compass" id="compass" style="display: none;">
      <i class="fas fa-compass"></i>
    </div>

    <button id="geolocate" title="Ir a mi ubicación">
      <i class="fas fa-location-arrow"></i>
    </button>

    <div id="map"></div>
  </div>

</div>

<script>
// ================= MAPA =================
const map = L.map('map').setView([36.5298, -6.2035], 16);

L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  { maxZoom:20, attribution:'Map data from <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>. © CARTO' }
).addTo(map);

// ================= GEOJSON =================
const campusGeoJSON = {
  "type":"FeatureCollection",
  "features":[
    {"type":"Feature","properties":{"clase":"espacio","edificio":"Facultad de Ciencias","planta":"1","tipo":"aula","nombre":"Aula C-101", "campus": "Cádiz"},
     "geometry":{"type":"Point","coordinates":[-6.2041,36.5301]}},

    {"type":"Feature","properties":{"clase":"espacio","edificio":"Facultad de Ciencias","planta":"1","tipo":"aula","nombre":"Aula C-102", "campus": "Cádiz"},
     "geometry":{"type":"Point","coordinates":[-6.2040,36.5300]}},

    {"type":"Feature","properties":{"clase":"espacio","edificio":"Escuela Superior de Ingeniería","planta":"baja","tipo":"cafete","nombre":"Fuente Patio ESI", "campus": "Puerto Real"},
     "geometry":{"type":"Point","coordinates":[-6.2028,36.5295]}},

  ]
};

// ================= ESTADO =================
const state = {
  edificio: "todos",
  planta: "todas",
  tipo: "todos",
  campus: "todos"
};

// ================= CAPA =================
const espaciosLayer = new L.LayerGroup().addTo(map);
let userLocationMarker = null;

// ================= ICONOS =================
function icon(tipo){
  const color = {aula:"#16a34a",fuente:"#ea580c"}[tipo] || "#6b7280";
  return L.divIcon({html:`<div style="background:${color};width:14px;height:14px;border-radius:50%"></div>`});
}

// ================= FILTRADO =================
function getFilteredFeatures(){
  return campusGeoJSON.features.filter(f=>{
    return (
      (state.edificio==="todos" || f.properties.edificio===state.edificio) &&
      (state.planta==="todas" || f.properties.planta===state.planta) &&
      (state.tipo==="todos" || f.properties.tipo===state.tipo) &&
      (state.campus==="todos" || f.properties.campus===state.campus)
    );
  });
}

// ================= RENDER MAPA =================
function renderMap(features){
  espaciosLayer.clearLayers();

  features.forEach(f=>{
    const m=L.marker(
      [f.geometry.coordinates[1],f.geometry.coordinates[0]],
      {title:f.properties.nombre,icon:icon(f.properties.tipo)}
    );

    m.bindPopup(`
      <div class="popup-card">
        <h4>${f.properties.nombre}</h4>
        Planta ${f.properties.planta}<br>
        Edificio: ${f.properties.edificio}<br>
        Campus: ${f.properties.campus}
      </div>`);

    espaciosLayer.addLayer(m);
  });

  searchControl.setLayer(espaciosLayer);
}

// ================= SIDEBAR =================
function renderSidebar(features){
  const cont=document.getElementById("sidebarContent");
  cont.innerHTML="";

  const estructura={};

  features.forEach(f=>{
    const e=f.properties.edificio;
    const p=f.properties.planta;
    estructura[e] ??= {};
    estructura[e][p] ??= [];
    estructura[e][p].push(f);
  });

  for(const e in estructura){
    cont.innerHTML+=`<h3>${e}</h3>`;
    for(const p in estructura[e]){
      cont.innerHTML+=`<b>Planta ${p}</b>`;
      estructura[e][p].forEach(f=>{
        cont.innerHTML+=`
          <div class="sidebar-item" onclick="fly('${f.properties.nombre}')">
            • ${f.properties.nombre}
          </div>`;
      });
    }
  }
}

// ================= BUSCADOR =================
const searchControl=new L.Control.Search({
  layer: espaciosLayer,
  propertyName:'title',
  zoom:19,
  marker:false
});
searchControl.on('search:locationfound',e=>e.layer.openPopup());
map.addControl(searchControl);

// ================= FLY =================
function fly(nombre){
  espaciosLayer.eachLayer(l=>{
    if(l.options.title===nombre){
      map.flyTo(l.getLatLng(),19);
      l.openPopup();
    }
  });
}

// ================= GEOLOCALIZACIÓN =================
document.getElementById('geolocate').addEventListener('click', () => {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const { latitude, longitude } = position.coords;
        if (userLocationMarker) {
          map.removeLayer(userLocationMarker);
        }
        userLocationMarker = L.marker([latitude, longitude], {
          icon: L.divIcon({
            html: `<div style="background:#3b82f6;width:16px;height:16px;border-radius:50%;border:2px solid white"></div>`,
            className: 'user-location-icon'
          })
        }).addTo(map);
        map.flyTo([latitude, longitude], 18);
      },
      (error) => {
        alert("No se pudo obtener tu ubicación. Por favor, asegúrate de que la geolocalización esté activada.");
      }
    );
  } else {
    alert("Tu navegador no soporta geolocalización.");
  }
});

// ================= ORIENTACIÓN =================
function handleOrientation(event) {
  if (!event.alpha) return;
  const compass = document.getElementById('compass');
  compass.style.display = 'flex';
  compass.style.transform = `rotate(${event.alpha}deg)`;
}

window.addEventListener('deviceorientation', handleOrientation, true);

// ================= TOGGLE SIDEBAR =================
document.getElementById('toggle-sidebar').addEventListener('click', () => {
  const sidebar = document.getElementById('sidebar');
  const layout = document.getElementById('layout');
  sidebar.classList.toggle('hidden');
  // Espera a que termine la animación del sidebar
  setTimeout(() => {
    map.invalidateSize();
  }, 310);
});

// ================= UPDATE =================
function update(){
  const feats=getFilteredFeatures();
  renderMap(feats);
  renderSidebar(feats);
}

// ================= EVENTOS =================
document.getElementById("fEdificio").onchange=e=>{state.edificio=e.target.value;update();}
document.getElementById("fPlanta").onchange=e=>{state.planta=e.target.value;update();}
document.getElementById("fTipo").onchange=e=>{state.tipo=e.target.value;update();}
document.getElementById("fCampus").onchange=e=>{state.campus=e.target.value;update();}

update();
</script>

</body>
</html>
